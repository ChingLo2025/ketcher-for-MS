<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structure to PPT</title>
    <style>
      /* Shown until React replaces #root; inline so it appears before any bundle arrives. */
      .boot { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: system-ui, sans-serif; color: #444; }
      .boot p { margin: 0; }
      .boot-hint { font-size: 13px; color: #888; }
      .boot-spinner { width: 32px; height: 32px; border: 3px solid #ddd; border-top-color: #3a6fd8; border-radius: 50%; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-spinner"></div>
        <p>Loading Ketcher…</p>
        <p class="boot-hint">The first visit downloads about 5 MB; later visits load from the browser cache.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
